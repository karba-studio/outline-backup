name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs tags and history for the changelog

      # Tags are cut from main. A tag pushed from develop would publish a
      # Homebrew formula pointing at code that was never released, so refuse it
      # here rather than discovering it after someone installs it.
      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME is not an ancestor of main."
            echo "Merge release/x.y.z into main first, then tag main. See docs/BRANCHING.md."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # arm64 images are built on an amd64 runner, so emulation is required.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A classic PAT with `repo` scope, able to push to
          # karba-studio/homebrew-tap and karba-studio/scoop-bucket.
          # GITHUB_TOKEN cannot write to other repositories, so without this the
          # release still publishes binaries and images - only the tap and
          # bucket updates are skipped. See docs/RELEASING.md.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
