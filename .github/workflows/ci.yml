name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # The project has no third-party dependencies and is meant to stay that
      # way: it handles backup credentials and encryption keys, so every import
      # is stdlib. This fails the build if a dependency sneaks in.
      - name: no third-party dependencies
        run: |
          if [ -s go.sum ]; then
            echo "go.sum is not empty; a dependency was added:"; cat go.sum; exit 1
          fi

      - name: cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/outline-backup
            echo "ok $target"
          done
